<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img">
  <title>ROOMS — Lit doorway app icon</title>
  <desc>Owner-selected lit doorway artwork (2026-10-16), redrawn as vector for all icon exports.</desc>
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a38c4"/>
      <stop offset=".3" stop-color="#211a63"/>
      <stop offset=".6" stop-color="#100d2b"/>
      <stop offset="1" stop-color="#07061a"/>
    </linearGradient>
    <radialGradient id="plateShade" cx=".72" cy=".38" r=".7">
      <stop offset="0" stop-color="#05040d" stop-opacity=".75"/>
      <stop offset="1" stop-color="#05040d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="plateBottom" x1="0" y1="1" x2=".6" y2=".45">
      <stop offset="0" stop-color="#4b37c9" stop-opacity=".6"/>
      <stop offset="1" stop-color="#4b37c9" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a99bff" stop-opacity=".95"/>
      <stop offset=".45" stop-color="#5b4bd0" stop-opacity=".35"/>
      <stop offset="1" stop-color="#6c5cf0" stop-opacity=".6"/>
    </linearGradient>
    <linearGradient id="sideWall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cbbcff"/>
      <stop offset=".45" stop-color="#a48cff"/>
      <stop offset="1" stop-color="#f1eaff"/>
    </linearGradient>
    <linearGradient id="backWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#140f45"/>
      <stop offset=".6" stop-color="#3a27c9"/>
      <stop offset="1" stop-color="#7a63ff"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4efff"/>
      <stop offset=".45" stop-color="#b7a3ff"/>
      <stop offset="1" stop-color="#7a5fff"/>
    </linearGradient>
    <linearGradient id="spill" x1=".45" y1="0" x2=".3" y2="1">
      <stop offset="0" stop-color="#8f74ff" stop-opacity=".8"/>
      <stop offset=".55" stop-color="#5a40e6" stop-opacity=".45"/>
      <stop offset="1" stop-color="#3a27b8" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="plateClip"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="blurSmall" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="150%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <rect x="100" y="112" width="824" height="824" rx="185" fill="#000" opacity=".45" filter="url(#drop)"/>
  <g clip-path="url(#plateClip)">
    <rect x="100" y="100" width="824" height="824" fill="url(#plate)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#plateShade)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#plateBottom)"/>
    <!-- Light falling out of the doorway onto the floor -->
    <path d="M352 694 L702 734 L960 960 L110 960 Z" fill="url(#spill)" filter="url(#soft)"/>
    <!-- Glow behind the arch -->
    <path d="M352 694 V450 A175 175 0 0 1 702 450 V734 Z" fill="#8a70ff" opacity=".45" filter="url(#soft)"/>
    <!-- Arch frame and lit right-hand wall -->
    <path d="M346 696 V448 A181 181 0 0 1 708 448 V736 Z" fill="url(#sideWall)"/>
    <!-- Far opening: dark back wall glowing toward the floor -->
    <path d="M360 690 V420 C360 372 392 330 440 316 C470 308 498 312 512 318 V648 Z" fill="url(#backWall)"/>
    <!-- Lit floor inside the room -->
    <path d="M360 690 L512 648 L702 734 Z" fill="url(#floor)"/>
    <path d="M372 688 L512 652 L600 690 Z" fill="#fff" opacity=".5" filter="url(#blurSmall)"/>
    <!-- Bright rim along the front edge of the arch -->
    <path d="M352 694 V448 A175 175 0 0 1 702 448" fill="none" stroke="#efe8ff" stroke-width="9" stroke-linecap="round" opacity=".9"/>
    <path d="M702 448 V734" fill="none" stroke="#f6f1ff" stroke-width="5" opacity=".7"/>
  </g>
  <rect x="102" y="102" width="820" height="820" rx="183" fill="none" stroke="url(#rim)" stroke-width="4"/>
</svg>
