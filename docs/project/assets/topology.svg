<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 570" role="img" aria-labelledby="title desc">
<title id="title">ROOMS system architecture</title><desc id="desc">Sandboxed React renderer uses a narrow native bridge. Main connects to social, access, Activities and a separate optional Agent. Voice connects independently to LiveKit. Stores have separate ownership.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#868098" stroke-width="1.5"/></marker></defs>
<rect width="1000" height="570" fill="#fff"/>
<g font-family="system-ui,sans-serif"><text x="32" y="36" font-size="15" font-weight="700" fill="#292437">ROOMS · boundaries and data ownership</text><text x="32" y="58" font-size="11" fill="#767080">Implementation snapshot 06f5477 · optional capabilities require separate acceptance</text>
<rect x="26" y="82" width="260" height="404" rx="15" fill="#f3f0fa" stroke="#d7cdeb"/>
<text x="47" y="108" font-size="11" fill="#716186" font-weight="600">USER'S MAC</text>
<rect x="47" y="132" width="218" height="75" rx="9" fill="#e4dbfa" stroke="#b6a3df"/><text x="66" y="161" font-size="15" fill="#342749" font-weight="600">React renderer</text><text x="66" y="184" font-size="11" fill="#5f5374">Sandboxed UI · no Node access</text>
<rect x="47" y="245" width="218" height="84" rx="9" fill="#fff" stroke="#b6a3df"/><text x="66" y="274" font-size="15" fill="#342749" font-weight="600">Preload + Electron main</text><text x="66" y="297" font-size="11" fill="#5f5374">Validated IPC · native credentials</text><text x="66" y="314" font-size="11" fill="#5f5374">Selected files / private providers</text>
<rect x="47" y="373" width="218" height="75" rx="9" fill="#fff" stroke="#b6a3df"/><text x="66" y="402" font-size="15" fill="#342749" font-weight="600">Persistent media runtime</text><text x="66" y="425" font-size="11" fill="#5f5374">Voice survives route / Activity changes</text>
<rect x="323" y="82" width="456" height="404" rx="15" fill="#f7f8fc" stroke="#d6d9e6"/><text x="344" y="108" font-size="11" fill="#60708c" font-weight="600">DEDICATED CORE</text>
<rect x="344" y="131" width="181" height="77" rx="9" fill="#fff" stroke="#bec7dc"/><text x="361" y="160" font-size="14" font-weight="600" fill="#26364f">Stoat social authority</text><text x="361" y="183" font-size="11" fill="#64718a">REST / events · membership</text>
<rect x="567" y="131" width="190" height="77" rx="9" fill="#fff" stroke="#bec7dc"/><text x="584" y="160" font-size="14" font-weight="600" fill="#26364f">Access broker</text><text x="584" y="183" font-size="11" fill="#64718a">Invites / roles / media grants</text>
<rect x="344" y="252" width="181" height="77" rx="9" fill="#fff" stroke="#bec7dc"/><text x="361" y="281" font-size="14" font-weight="600" fill="#26364f">Activity authority</text><text x="361" y="304" font-size="11" fill="#64718a">Single writer · revisions / games</text>
<rect x="567" y="373" width="190" height="75" rx="9" fill="#edf5f4" stroke="#adceca"/><text x="584" y="402" font-size="14" font-weight="600" fill="#214941">LiveKit SFU</text><text x="584" y="425" font-size="11" fill="#567a75">Actual participants / audio / video</text>
