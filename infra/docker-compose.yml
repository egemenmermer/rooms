name: rooms
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: rooms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run node scripts/spacebar-setup.mjs first}
      POSTGRES_DB: spacebar
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rooms -d spacebar"]
      interval: 3s
      retries: 20
  spacebar:
    build:
      context: ..
      dockerfile: infra/spacebar.Dockerfile
    environment:
      DATABASE: postgres://rooms:${POSTGRES_PASSWORD}@postgres:5432/spacebar
      CONFIG_PATH: /config/config.json
      CONFIG_READONLY: 'true'
      THREADS: '1'
    ports:
      - '127.0.0.1:3003:3001'
    volumes:
      - ./local/config:/config:ro
      - spacebar-files:/spacebar/files
    depends_on:
      postgres:
        condition: service_healthy
  proxy:
    image: nginx:1.28-alpine
    ports:
      - '127.0.0.1:3001:3001'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [spacebar, access]
  access:
    build:
      context: ..
      dockerfile: infra/access.Dockerfile
    environment:
      SERVICE_HOST: 0.0.0.0
      PORT: 3002
      SPACEBAR_INTERNAL_URL: http://spacebar:3001
      LIVEKIT_INTERNAL_URL: http://livekit:7880
      LIVEKIT_PUBLIC_URL: ws://127.0.0.1:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?Missing local LiveKit key}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?Missing local LiveKit secret}
    ports:
      - '127.0.0.1:3002:3002'
    depends_on: [spacebar, livekit]
  livekit:
    image: livekit/livekit-server:v1.13.9
    command: ["--config", "/etc/livekit.yaml"]
    ports:
      - '127.0.0.1:7880:7880'
      - '127.0.0.1:7881:7881'
      - '127.0.0.1:50000-50020:50000-50020/udp'
    volumes:
      - ./local/livekit.yaml:/etc/livekit.yaml:ro
volumes:
  postgres-data:
  spacebar-files:
