name: Add verified Windows candidate to existing RC7
on:
  push:
    branches: [codex/reference-package]
    paths: [.github/workflows/windows-rc7-add.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  add-verified-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: egemenmermer/rooms
    steps:
      - name: Fetch only the successful frozen-source Windows build
        run: |
          set -euo pipefail
          gh api repos/egemenmermer/rooms/actions/runs/38535819401 > run.json
          jq -e '.conclusion == "success" and .head_sha == "bec563c988d1e93e9acf12fdd518c04c596b56d5"' run.json
          gh run download 38535819401 --name rooms-rc7-windows-x64-candidate --dir candidate
      - name: Verify receipt and exact executable before publication
        run: |
          set -euo pipefail
          jq -e '.status == "PASS_NATIVE_WINDOWS_PACKAGE" and .version == "0.1.18-rc.7" and .sourceSha == "b38f8e91b600bd4319e1ddc885b2831542790859" and .platform == "win32" and .arch == "x64" and .signed == false and .rendererErrors == []' candidate/windows-rc7-results.json
          echo 'eacd4adb42f8db1aeacfd9bfbe533427cebd461ecb71001df9fabe6ba3388add  candidate/ROOMS-0.1.18-rc.7-windows-x64-setup.exe' | sha256sum --check --strict
          python3 - <<'PYCODE'
          import pathlib,struct
          data=pathlib.Path('candidate/ROOMS-0.1.18-rc.7-windows-x64-setup.exe').read_bytes()
          offset=struct.unpack_from('<I',data,0x3c)[0]
          assert data[offset:offset+4]==b'PE\0\0'
          optional=offset+24
          magic=struct.unpack_from('<H',data,optional)[0]
          directory=optional+(112 if magic==0x20b else 96)
          assert struct.unpack_from('<II',data,directory+4*8)==(0,0), 'Unexpected Authenticode state'
          print('Confirmed unsigned PE installer; no trusted-publisher claim')
          PYCODE
          gh api repos/egemenmermer/rooms/releases/tags/v0.1.18-rc.7 > release-before.json
          jq -e '.draft == false and .prerelease == true and .target_commitish == "b38f8e91b600bd4319e1ddc885b2831542790859"' release-before.json
      - name: Add candidate files, without replacing any existing asset
        run: |
          set -euo pipefail
          gh release upload v0.1.18-rc.7 candidate/ROOMS-0.1.18-rc.7-windows-x64-setup.exe candidate/windows-rc7-results.json candidate/windows-rc7-900.png candidate/windows-rc7-1440.png
          gh api repos/egemenmermer/rooms/releases/tags/v0.1.18-rc.7 > release-after.json
          python3 - <<'PYCODE'
          import json
          before=json.load(open('release-before.json'));after=json.load(open('release-after.json'))
          current={item['id']:item for item in after['assets']}
          for item in before['assets']:
            assert item['id'] in current
            for key in ['name','size','digest','updated_at']:
              assert item.get(key)==current[item['id']].get(key), f'Existing asset changed: {key}'
          installer=next(item for item in after['assets'] if item['name']=='ROOMS-0.1.18-rc.7-windows-x64-setup.exe')
          assert installer['digest']=='sha256:eacd4adb42f8db1aeacfd9bfbe533427cebd461ecb71001df9fabe6ba3388add'
          print('Windows candidate added; all existing release assets preserved')
          PYCODE
# Owner explicitly requested adding the verified Windows build to RC7.
# No signing keys, production server access or Mac update-feed modification.
